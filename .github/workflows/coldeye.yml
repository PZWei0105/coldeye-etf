name: coldeye

on:
  schedule:
    # 時間皆為 UTC；台灣時間 = UTC+8
    - cron: '37,47,53 0 * * 1-5' # 08:37–08:53 開盤前暖身（備援：常常延遲到 09:15 以後；第一輪平常由清晨的 wake.yml 在 09:00:30 發出）
    - cron: '4-59/10 1-5 * * 1-5' # 盤中備援：接力萬一斷掉，最慢約 10 分鐘（加上 GitHub 的延遲）會重新接上
    - cron: '25 6 * * 1-5'       # 14:25 收盤行情
    - cron: '40 7 * * 1-5'       # 15:40 三大法人
    - cron: '50 9 * * 1-5'       # 17:50 投信公告淨值
    - cron: '55 13 * * 1-5'      # 21:55 融資融券
    - cron: '20 1 * * 6'         # 週六 09:20 集保受益人數
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto / intraday / eod / backfill / probe / deploy / global / night'
        default: auto

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: coldeye-data
  cancel-in-progress: false

jobs:
  # 抓資料、計算、把網站打包好（不碰 Pages 環境，Pages 有狀況時資料照樣更新）
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    outputs:
      deploy: ${{ steps.pipe.outputs.deploy }}
      next_at: ${{ steps.pipe.outputs.next_at }}
      next_mode: ${{ steps.pipe.outputs.next_mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - id: pipe
        run: python -m pipeline.dispatch
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          REPO: ${{ github.repository }}
      # 公開專案太久沒有活動，GitHub 會自動停用排程；每週六順手重新啟用一次（失敗也不影響其他步驟）
      - if: github.event_name == 'schedule' && github.event.schedule == '20 1 * * 6'
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/coldeye.yml/enable" || true
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/wake.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.pipe.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # 發布到 GitHub Pages
  deploy:
    needs: run
    if: needs.run.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # 接力：GitHub 的排程忙的時候常常延遲半小時以上，所以每一輪自己排好下一輪：
  # 白天盤中約 5 分鐘一輪（intraday，13:36 以後停）；晚上 15:05～05:30 每 10 分鐘一輪全球市場（night：台指期夜盤、美股盤中）
  next:
    needs: run
    if: ${{ !cancelled() && needs.run.outputs.next_at != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - run: |
          wait=$(( NEXT_AT - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then echo "等 ${wait} 秒再發出下一輪"; sleep "$wait"; fi
          # 已經有排隊中的執行（排程或推送）就交給它接力，不要把它擠掉
          for st in pending queued; do
            n=$(gh api "repos/${REPO}/actions/workflows/coldeye.yml/runs?status=${st}&per_page=1" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then echo "已有 ${st} 的執行，交給它接力"; exit 0; fi
          done
          gh api -X POST "repos/${REPO}/actions/workflows/coldeye.yml/dispatches" -f ref=main -f "inputs[mode]=${NEXT_MODE:-intraday}"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NEXT_AT: ${{ needs.run.outputs.next_at }}
          NEXT_MODE: ${{ needs.run.outputs.next_mode }}
