name: coldeye

on:
  schedule:
    # 時間皆為 UTC；台灣時間 = UTC+8
    - cron: '*/15 1-5 * * 1-5'   # 09:00–13:45 盤中，每 15 分鐘
    - cron: '25 6 * * 1-5'       # 14:25 收盤行情
    - cron: '40 7 * * 1-5'       # 15:40 三大法人
    - cron: '50 9 * * 1-5'       # 17:50 投信公告淨值
    - cron: '55 13 * * 1-5'      # 21:55 融資融券
    - cron: '20 1 * * 6'         # 週六 09:20 集保受益人數
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto / intraday / eod / backfill / probe / deploy'
        default: auto

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coldeye-data
  cancel-in-progress: false

jobs:
  # 抓資料、計算、把網站打包好（不碰 Pages 環境，Pages 有狀況時資料照樣更新）
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    outputs:
      deploy: ${{ steps.pipe.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - id: pipe
        run: python -m pipeline.dispatch
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          REPO: ${{ github.repository }}
      - if: steps.pipe.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # 發布到 GitHub Pages
  deploy:
    needs: run
    if: needs.run.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
