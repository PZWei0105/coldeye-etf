name: wake

# 叫醒：GitHub 的排程常常延遲半小時到一小時。coldeye.yml 08:37–08:53 的暖身排程每天都延遲到 09:15 以後，
# 開盤後前 20 分鐘沒有新資料；收盤後第一次完整計算也要看排程延遲多久（10/28 拖到 14:49 才手動補算好）。
# 這裡先起來（延遲一兩個小時也還來得及），照順序發出（pipeline/wake.py）：
#   早班 07:45 全球市場（美股收盤、台指期夜盤收盤）→ 09:00:30 第一輪盤中更新
#   下午班 14:15 收盤後計算 → 15:05 晚上的全球市場接力（台指期夜盤、美股盤中，每 10 分鐘到隔天 05:30）
#   夜班 21:23、01:23 看門：晚上的接力沒有備援排程，冷眼 20 分鐘以上沒有任何執行才發一輪接上（平常什麼都不做）
# 之後照舊由冷眼自己接力。不和 coldeye 共用排隊，睡覺時不會擋住推送或其他工作；
# 同一班好幾個排程都跑起來時，只有最早的那個在等，其他的馬上結束。
on:
  schedule:
    # 時間皆為 UTC（台灣時間 = UTC+8）
    - cron: '13 21 * * 0-4'   # 05:13（台灣的週一到週五 = UTC 的週日到週四）
    - cron: '13 22 * * 0-4'   # 06:13
    - cron: '13 23 * * 0-4'   # 07:13
    - cron: '13 2 * * 1-5'    # 10:13
    - cron: '13 3 * * 1-5'    # 11:13
    - cron: '13 4 * * 1-5'    # 12:13
    - cron: '23 13 * * 1-5'   # 21:23 夜班看門（看到 01:15）
    - cron: '23 17 * * 1-5'   # 01:23 夜班看門（看到 05:05；台灣的週二到週六清晨 = UTC 的週一到週五）
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pipeline.wake
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
