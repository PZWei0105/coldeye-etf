<script>
/* 換裝（skin.js）：這支手機選的那一套，CSS 在畫面出來之前就放進去，打開時不會先閃一下機甲 HUD */
try {
  var sk = (JSON.parse(localStorage.getItem('coldeye.settings') || '{}') || {}).skin;
  if (/^(term|sonar|led|ink)$/.test(sk)) {
    document.documentElement.setAttribute('data-skin', sk);
    document.documentElement.setAttribute('data-theme', sk === 'ink' ? 'light' : 'dark');
    document.write('<link rel="stylesheet" href="skins/base.css" data-skin-css><link rel="stylesheet" href="skins/' + sk + '.css" data-skin-css><link rel="modulepreload" href="skins/' + sk + '.js">');
  }
} catch (e) { /* 讀不到設定：用機甲 HUD */ }
</script>
